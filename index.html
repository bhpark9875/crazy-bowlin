<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crazy Bowl-in</title>
<meta name="theme-color" content="#eaf5fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1624" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bowl-in">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<style>
/* Layout: mobile sports-log app. Sticky app bar, three tab pages (My balls / Ball motion / Drilling), fixed bottom tab bar.
   Condensed numerals carry the stats; one cobalt accent marks the selected ball and active controls. */
:root {
  --bg: #eaf5fc; --surface: #ffffff; --surface2: #f3f9fd;
  --ink: #13294a; --ink2: #44597a; --muted: #687b95; --line: #d5e5f1; --grid: #e4eef6;
  --accent: #2f6fbe; --on-accent: #ffffff; --wash: rgba(47, 111, 190, 0.09);
  --brand: #e48a2a; --on-brand: #ffffff; --brand-wash: rgba(228, 138, 42, 0.12);
  --good: #14804a; --warn: #a15c00; --bad: #c8202f;
  --z0: #e1edf6; --z1: #cddeeb; --z2: #b7ccdd;
  --lane: #efdcb9; --laneLine: #a77d48; --gutter: #cfdbe6; --oil: rgba(70, 130, 215, 0.20);
  --pin: #ffffff; --pinEdge: #8a9cb2; --path0: #8ea2ba;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1624; --surface: #132137; --surface2: #18283f;
    --ink: #eaf2fb; --ink2: #b3c4da; --muted: #8799b1; --line: #24364f; --grid: #1c2c42;
    --accent: #6aa5f0; --on-accent: #0c1624; --wash: rgba(106, 165, 240, 0.14);
    --brand: #f2a85a; --on-brand: #1a1206; --brand-wash: rgba(242, 168, 90, 0.14);
    --good: #3fbf7f; --warn: #e0a040; --bad: #ef6b63;
    --z0: #1c2b40; --z1: #27394f; --z2: #344962;
    --lane: #4a3926; --laneLine: #1f170d; --gutter: #22324a; --oil: rgba(90, 150, 230, 0.20);
    --pin: #e9eef3; --pinEdge: #6b7c93; --path0: #7d90a8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1624; --surface: #132137; --surface2: #18283f;
  --ink: #eaf2fb; --ink2: #b3c4da; --muted: #8799b1; --line: #24364f; --grid: #1c2c42;
  --accent: #6aa5f0; --on-accent: #0c1624; --wash: rgba(106, 165, 240, 0.14);
  --brand: #f2a85a; --on-brand: #1a1206; --brand-wash: rgba(242, 168, 90, 0.14);
  --good: #3fbf7f; --warn: #e0a040; --bad: #ef6b63;
  --z0: #1c2b40; --z1: #27394f; --z2: #344962;
  --lane: #4a3926; --laneLine: #1f170d; --gutter: #22324a; --oil: rgba(90, 150, 230, 0.20);
  --pin: #e9eef3; --pinEdge: #6b7c93; --path0: #7d90a8;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.55; word-break: keep-all; overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 720px; margin-inline: auto; }

/* app bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 14px 10px; }
.logo { width: 34px; height: 34px; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px var(--brand); object-fit: cover; }
.appbar h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.appbar .tag { margin-left: auto; font-family: var(--font-num); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }

/* bottom tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabbar .in { max-width: 720px; margin-inline: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; }
.tabbar a { position: relative; display: grid; justify-items: center; align-content: center; gap: 1px; min-height: 54px; border-radius: 10px; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 500; }
.tabbar a b { font-family: var(--font-num); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; }
.tabbar a[aria-current="page"] { color: var(--accent); }
.tabbar a[aria-current="page"]::before { content: ""; position: absolute; top: -7px; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tabbar a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* page + type */
.page { display: flex; flex-direction: column; gap: 14px; }
.page > * { min-width: 0; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 4px; }
.ph h2 { margin: 0; font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; }
.sec { font-family: var(--font-num); font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.card-h h3 { margin: 0; font-size: 16px; font-weight: 700; }
.fn { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
.notice { font-size: 13px; color: var(--ink2); background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0; }
.notice b { color: var(--ink); font-weight: 500; }
.count { font-family: var(--font-num); font-size: 15px; font-weight: 600; color: var(--muted); }
.count b { font-size: 26px; color: var(--ink); margin-right: 2px; }

/* buttons + controls */
.btn { font: inherit; font-size: 14px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 16px; min-height: 46px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink2); border-radius: 999px; padding: 6px 13px; min-height: 38px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .flabel { font-size: 13px; font-weight: 500; color: var(--ink2); }
.txt, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-height: 46px; }
.btn:focus-visible, .seg button:focus-visible, .txt:focus-visible, select:focus-visible, .sb:focus-visible, .sv:focus-visible, .lnk:focus-visible, .row-main:focus-visible, .row-edit:focus-visible, input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* stepper */
.stps { display: grid; gap: 14px; }
@media (min-width: 620px) { .stps.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } .stps.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stp { display: grid; gap: 6px; min-width: 0; }
.stp-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.stp-k { font-weight: 700; font-size: 14px; }
.stp-s { font-size: 12px; color: var(--muted); }
.stp-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) 46px; gap: 6px; }
.sb { font: inherit; font-size: 22px; line-height: 1; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 12px; min-height: 46px; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.sb:active { background: var(--wash); }
.sv { font-family: var(--font-num); font-weight: 600; font-size: 24px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; width: 100%; padding: 4px; }
.stp-meta { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 12px; color: var(--muted); align-items: center; min-height: 30px; }
.dl { color: var(--ink2); font-variant-numeric: tabular-nums; }
.dl.warn { color: var(--bad); }
.lnk { font: inherit; font-size: 12px; background: none; border: 0; color: var(--accent); padding: 4px 0; cursor: pointer; margin-left: auto; min-height: 30px; }

/* range */
.rng { display: grid; gap: 4px; }
.rng-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.rng-top span { font-size: 13px; font-weight: 500; color: var(--ink2); }
.rng-top output { font-family: var(--font-num); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.rng-top output small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 2px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; margin: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) 0 var(--fill), var(--z1) var(--fill) 100%); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) 0 var(--fill), var(--z1) var(--fill) 100%); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); margin-top: -9px; }
input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
.rng-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

/* map */
.map svg { display: block; width: 100%; max-width: 540px; height: auto; margin-inline: auto; overflow: visible; }
svg text { font-family: var(--font-body); }
svg .num { font-family: var(--font-num); font-weight: 600; }
.quads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.qd { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink2); }
.qd b { font-family: var(--font-num); font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1; }
.qd.top { border-color: var(--accent); background: var(--wash); }
.qsum { margin: 10px 0 0; font-size: 14px; }
.qsum b { font-weight: 700; }

/* ball list */
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.row-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 4px; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; cursor: pointer; min-height: 60px; border-radius: 10px; }
.row-main:hover { background: var(--surface2); }
.nb { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--surface); font-family: var(--font-num); font-weight: 700; font-size: 15px; }
.nb.sel { background: var(--accent); color: var(--on-accent); }
.rn { font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rs { display: block; font-size: 12px; color: var(--muted); }
.rs .v { font-family: var(--font-num); font-weight: 600; font-size: 13.5px; color: var(--ink2); letter-spacing: 0.02em; }
.rt { font-size: 12px; color: var(--ink2); text-align: right; white-space: nowrap; }
.rt::after { content: "›"; margin-left: 8px; font-size: 18px; color: var(--muted); vertical-align: -1px; }
.row-edit { font: inherit; font-size: 12px; color: var(--ink2); background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 36px; cursor: pointer; }
.empty { text-align: center; color: var(--muted); font-size: 14px; padding: 18px 8px; margin: 0; }

/* editor */
.editor { display: grid; gap: 16px; border-color: var(--accent); }
.feel-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

/* motion */
.picker { display: grid; gap: 6px; }
.hero h3 { margin: 4px 0 2px; font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; text-wrap: balance; }
.hero p { margin: 0; font-size: 13px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
@media (min-width: 620px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface2); min-width: 0; display: grid; gap: 2px; }
.stat > span { font-size: 12px; color: var(--muted); }
.stat > b { font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat > b small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; justify-self: start; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.lanewrap { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .lanewrap { grid-template-columns: 250px minmax(0, 1fr); align-items: start; } }
.lanefig svg { display: block; width: 100%; max-width: 250px; height: auto; margin-inline: auto; }
.ctrls { display: grid; gap: 14px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink2); justify-content: center; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 3px; border-radius: 2px; }
.advice { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 14px; color: var(--ink2); }
.advice li { padding-left: 14px; position: relative; }
.advice li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.advice b { color: var(--ink); font-weight: 500; }

/* drill compare */
.lstr { font-family: var(--font-num); font-weight: 700; font-size: 34px; letter-spacing: 0.02em; line-height: 1.1; margin: 4px 0 0; }
.lstr small { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.cmp { display: grid; gap: 4px; padding-block: 10px; }
.cmp + .cmp { border-top: 1px solid var(--line); }
.cmp-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cmp-h b { font-size: 14px; }
.cmp-h span { font-size: 13px; color: var(--ink2); }
.cmp-h span strong { font-family: var(--font-num); font-size: 17px; color: var(--ink); }
.db { position: relative; height: 20px; margin-inline: 9px; }
.db .tr { position: absolute; left: 0; right: 0; top: 9px; height: 2px; background: var(--z1); border-radius: 1px; }
.db .ln { position: absolute; top: 8px; height: 4px; background: var(--accent); opacity: 0.35; border-radius: 2px; }
.db .d0, .db .d1 { position: absolute; top: 3px; width: 14px; height: 14px; border-radius: 50%; transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.db .d0 { background: var(--path0); }
.db .d1 { background: var(--accent); }
.db-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

/* scores calendar */
.calgrid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 340px) { .calgrid { grid-template-columns: minmax(0, 1fr); } }
.calgrid .card { padding: 12px 10px; }
.calnav { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.calnav + .calnav { margin-top: 4px; }
.calnav button { width: 34px; height: 34px; border: 0; background: var(--surface2); border-radius: 9px; font-size: 18px; line-height: 1; color: var(--ink); cursor: pointer; }
.calnav b { font-family: var(--font-num); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.calnav.y b { font-size: 15px; color: var(--ink2); }
.calnav.y button { width: 28px; height: 28px; font-size: 15px; }
.dow, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
.dow { margin-top: 8px; }
.dow span { font-size: 10.5px; color: var(--muted); padding-block: 2px; }
.dow span:first-child { color: var(--bad); }
.dow span:last-child { color: var(--accent); }
.day { position: relative; aspect-ratio: 1; max-width: 100%; border: 0; background: none; border-radius: 50%; font-family: var(--font-num); font-weight: 600; font-size: 14px; color: var(--ink); cursor: pointer; padding: 0; font-variant-numeric: tabular-nums; }
.day.out { visibility: hidden; }
.day.has::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
.day.today { box-shadow: inset 0 0 0 1.5px var(--ink2); }
.day.sel { background: var(--accent); color: var(--on-accent); }
.day.sel.has::after { background: var(--on-accent); }
.day:focus-visible, .calnav button:focus-visible, .gdel:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.todaybtn { display: block; margin: 6px auto 0; min-height: 28px; }
.avgc { display: grid; gap: 10px; align-content: start; }
.seg.sm { flex-wrap: nowrap; gap: 3px; }
.seg.sm button { flex: 1; min-width: 0; padding: 4px 0; min-height: 32px; font-size: 12.5px; }
.avgnum { font-family: var(--font-num); font-size: clamp(28px, 9vw, 44px); white-space: nowrap; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.avgnum small { font-size: 18px; color: var(--muted); }
.avgsub { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.avgsub b { font-family: var(--font-num); font-size: 16px; color: var(--ink); font-weight: 700; }
.glist { list-style: none; margin: 0; padding: 0; }
.glist li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.glist li:first-child { border-top: 0; }
.gno { font-family: var(--font-num); font-weight: 600; font-size: 14px; color: var(--muted); width: 26px; }
.gsc { font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1; min-width: 56px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.gball { flex: 1; min-width: 0; font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gdel { font: inherit; font-size: 12px; color: var(--ink2); background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 36px; cursor: pointer; }
.gdel.armed { color: var(--bad); border-color: var(--bad); }
.gadd { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); gap: 8px; margin-top: 14px; }
.gadd .btn { grid-column: 1 / -1; }
.gscore { font-family: var(--font-num) !important; font-weight: 700; font-size: 24px !important; text-align: center; font-variant-numeric: tabular-nums; }
.gsum { font-family: var(--font-num); font-size: 15px; font-weight: 600; color: var(--muted); }
.gsum b { color: var(--ink); font-size: 18px; }

/* splash */
#splash { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; transition: opacity 0.35s ease; }
#splash.out { opacity: 0; pointer-events: none; }
.sp { display: grid; justify-items: center; gap: 14px; }
.sp-icon { width: 168px; height: 168px; border-radius: 26%; box-shadow: 0 12px 30px rgba(19, 41, 74, 0.18); animation: pop 0.9s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes pop { 0% { transform: scale(0.4) rotate(-10deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
.sp-ball { width: 22px; height: 22px; border-radius: 50%; background: var(--bad); animation: rollin 0.8s 0.5s ease-out both; }
@keyframes rollin { from { transform: translateX(-120px) rotate(-360deg); opacity: 0; } to { transform: none; opacity: 1; } }
.sp-title { font-family: var(--font-num); font-size: 30px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink); opacity: 0; animation: fadeup 0.45s 0.75s ease both; }
.sp-sub { font-family: var(--font-num); font-weight: 600; letter-spacing: 0.2em; font-size: 12px; color: var(--muted); opacity: 0; animation: fadeup 0.45s 0.9s ease both; }
@keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .sp-icon, .sp-ball, .sp-title, .sp-sub { animation: none; opacity: 1; } }

/* brag */
.brag { border-color: var(--brand); }
.brag .card-h h3::after { content: " 🐶"; }
.brtxt { font-family: var(--font-body); font-size: 14px; line-height: 1.6; resize: none; min-height: 132px; background: var(--brand-wash); border-color: transparent; margin-top: 12px; }
.btn.brand { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.day.pick { box-shadow: inset 0 0 0 2.5px var(--brand); }
.day.sel.pick { box-shadow: inset 0 0 0 2.5px var(--brand), 0 0 0 0; }
</style>

<script>
(function () {
  "use strict";
  // ---------------- constants ----------------
  var LIM = { rg: [2.43, 2.80], diff: [0, 0.060], asy: [0, 0.030] };
  var BASE = { rg: 2.560, diff: 0.040, asy: 0.010 };
  var KEYS = ["rg", "diff", "asy"];
  var LBL = { rg: "RG", diff: "Diff", asy: "ASY" };
  var SUB = { rg: "회전반경 · 언제 구르나", diff: "차이값 · 얼마나 꺾이나", asy: "비대칭값 · 지공 민감도" };
  var ZONES = { rg: [2.52, 2.60], diff: [0.030, 0.045], asy: [0.005, 0.015] };
  var ZN = ["낮음", "중간", "높음"];
  var SENT = {
    rg: ["RG가 낮아 오일 구간에서 일찍 구르기 시작해요.", "RG가 중간이라 구르기 시작하는 타이밍이 무난해요.", "RG가 높아 늦게 구르기 시작하고 길게 미끄러져요."],
    diff: ["Diff가 낮아 플레어가 작고 호가 부드러워요.", "Diff가 중간이라 무난하게 꺾여요.", "Diff가 높아 플레어가 크고 많이 꺾여요."],
    asy: ["ASY가 낮아 대칭에 가깝고, 지공을 바꿔도 성격 변화가 작아요.", "ASY가 약한 비대칭이라 지공에 따라 성격이 조금 바뀌어요.", "ASY가 높아 반응이 빠르고 지공에 따라 성격이 크게 바뀌어요."]
  };
  var QNAME = [["일찍 구르고 크게 꺾이는 타입", "길게 미끄러지다 크게 꺾이는 타입"], ["일찍 구르고 부드럽게 도는 타입", "길게 가다 부드럽게 도는 타입"]];
  var QSHORT = [["일찍 · 크게 꺾임", "길게 · 크게 꺾임"], ["일찍 · 부드럽게", "길게 · 부드럽게"]];
  var COVERS = [["solid", "솔리드", 0.95], ["hybrid", "하이브리드", 0.85], ["pearl", "펄", 0.72], ["urethane", "우레탄", 0.45], ["plastic", "플라스틱", 0.12]];
  var GRITS = [["500", "500", 0.12], ["1000", "1000", 0.08], ["1500", "1500", 0.04], ["2000", "2000", 0], ["3000", "3000", -0.04], ["4000", "4000", -0.07], ["compound", "컴파운드", -0.10], ["polish", "폴리시", -0.14]];
  var FEEL = ["많이 약하게", "약하게", "기본", "강하게", "많이 강하게"];

  // ---------------- helpers ----------------
  function $(s, r) { return (r || document).querySelector(s); }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function f3(v) { return Number(v).toFixed(3); }
  function zone(k, v) { var z = ZONES[k]; return v < z[0] ? 0 : (v <= z[1] ? 1 : 2); }
  function quad(b) { return { x: b.rg < BASE.rg ? 0 : 1, y: b.diff >= BASE.diff ? 0 : 1 }; }
  function typeName(b) { var q = quad(b); return QNAME[q.y][q.x]; }
  function lookup(list, key) { for (var i = 0; i < list.length; i++) if (list[i][0] === key) return list[i]; return list[0]; }
  var FR = { 0: "", 1: "⅛", 2: "¼", 3: "⅜", 4: "½", 5: "⅝", 6: "¾", 7: "⅞" };
  function frac(x) {
    var e = Math.round(Math.abs(x) * 8), w = Math.floor(e / 8), r = e % 8;
    return (w || !r ? String(w) : "") + FR[r] + "″";
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function parseYmd(t) { var a = t.split("-"); return new Date(+a[0], +a[1] - 1, +a[2]); }
  function fracPlain(x) { return frac(x).replace("″", ""); }

  // ---------------- state ----------------
  var KEY = "myball.note.v1", st = null;
  try { st = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  function fresh() {
    return {
      profile: { hand: "R", papH: 5, papV: 0.5, rpm: 330, speed: 27, stand: 25, aim: 15, oil: 40, tilt: 12, rot: 45 },
      balls: [{ id: 1, name: "만트라 (예시)", rg: 2.498, diff: 0.047, asy: 0.011, cover: "hybrid", grit: "compound", feel: 0, coverName: "HK22 Inciter Xtreme", layout: null }],
      sel: 1, nextId: 2
    };
  }
  if (!st || !st.profile || !Array.isArray(st.balls)) st = fresh();
  if (st.profile.tilt == null) st.profile.tilt = 12;
  if (st.profile.rot == null) st.profile.rot = 45;
  if (!Array.isArray(st.games)) st.games = [];
  (function () { var t = new Date(); if (!st.cal) st.cal = { y: t.getFullYear(), m: t.getMonth(), sel: ymd(t), mode: "month", lastBall: 0 }; })();
  var edit = null; // ball being added/edited (not persisted)
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function selBall() { var b = st.balls.filter(function (x) { return x.id === st.sel; })[0]; if (!b && st.balls.length) { b = st.balls[0]; st.sel = b.id; } return b; }
  function idx(b) { return st.balls.indexOf(b) + 1; }

  // ---------------- components ----------------
  function stepper(o) {
    var el = document.createElement("div");
    el.className = "stp";
    el.innerHTML =
      '<div class="stp-top"><span class="stp-k">' + o.label + "</span>" + (o.sub ? '<span class="stp-s">' + o.sub + "</span>" : "") + "</div>" +
      '<div class="stp-row"><button type="button" class="sb" aria-label="' + o.label + ' 내리기">−</button>' +
      '<input class="sv" id="' + o.id + '" inputmode="decimal" autocomplete="off" aria-label="' + o.label + ' 값">' +
      '<button type="button" class="sb" aria-label="' + o.label + ' 올리기">+</button></div>' +
      '<div class="stp-meta"><span class="ex"></span><span class="dl"></span>' + (o.base != null ? '<button type="button" class="lnk">기준값으로</button>' : "") + "</div>";
    var btns = el.querySelectorAll(".sb"), inp = $(".sv", el), ex = $(".ex", el), dl = $(".dl", el);
    function fx(v) { return Number(v).toFixed(o.dec); }
    function refresh() {
      var v = o.get();
      inp.value = fx(v);
      ex.textContent = o.extra ? o.extra(v) : (o.base != null ? "기준 " + fx(o.base) : "");
      dl.className = "dl";
      if (o.base != null) {
        var d = +(v - o.base).toFixed(o.dec);
        dl.textContent = d === 0 ? "· 기준과 같음" : "· 차이 " + (d > 0 ? "+" : "−") + Math.abs(d).toFixed(o.dec);
      } else dl.textContent = "";
    }
    function setv(v) { o.set(+clamp(Math.round(v / o.step) * o.step, o.min, o.max).toFixed(o.dec)); refresh(); if (o.onChange) o.onChange(); }
    function bump(dir, mult) { setv(o.get() + dir * o.step * mult); }
    function hold(btn, dir) {
      var t1, t2, n = 0;
      function stop() { clearTimeout(t1); clearInterval(t2); }
      btn.addEventListener("pointerdown", function (e) {
        e.preventDefault(); stop(); bump(dir, 1); n = 0;
        t1 = setTimeout(function () { t2 = setInterval(function () { n++; bump(dir, n > 14 ? 10 : 1); }, 70); }, 380);
        if (btn.setPointerCapture) { try { btn.setPointerCapture(e.pointerId); } catch (x) {} }
      });
      ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (ev) { btn.addEventListener(ev, stop); });
      btn.addEventListener("click", function (e) { if (e.detail === 0) bump(dir, 1); });
    }
    hold(btns[0], -1); hold(btns[1], 1);
    inp.addEventListener("change", function () {
      var v = parseFloat(inp.value.trim().replace(",", "."));
      if (isNaN(v)) { refresh(); dl.className = "dl warn"; dl.textContent = "숫자로 넣어주세요"; return; }
      var c = clamp(v, o.min, o.max);
      setv(c);
      if (c !== v) { dl.className = "dl warn"; dl.textContent = fx(o.min) + "~" + fx(o.max) + " 범위로 맞췄어요"; }
    });
    inp.addEventListener("keydown", function (e) {
      if (e.key === "ArrowUp") { e.preventDefault(); bump(1, e.shiftKey ? 10 : 1); }
      else if (e.key === "ArrowDown") { e.preventDefault(); bump(-1, e.shiftKey ? 10 : 1); }
      else if (e.key === "Enter") inp.blur();
    });
    var lnk = $(".lnk", el);
    if (lnk) lnk.addEventListener("click", function () { setv(o.base); });
    el.refresh = refresh;
    refresh();
    return el;
  }
  function segmented(opts, get, set, label) {
    var el = document.createElement("div");
    el.className = "seg"; el.setAttribute("role", "group"); el.setAttribute("aria-label", label);
    opts.forEach(function (op) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = op[1]; b.dataset.v = op[0];
      b.addEventListener("click", function () { set(op[0]); refresh(); });
      el.appendChild(b);
    });
    function refresh() { el.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.v === String(get()))); }); }
    el.refresh = refresh; refresh();
    return el;
  }
  function range(o) {
    var el = document.createElement("div");
    el.className = "rng";
    el.innerHTML = '<div class="rng-top"><span>' + o.label + '</span><output for="' + o.id + '"></output></div>' +
      '<input type="range" id="' + o.id + '" min="' + o.min + '" max="' + o.max + '" step="' + o.step + '">' +
      (o.ends ? '<div class="rng-ends"><span>' + o.ends[0] + "</span><span>" + o.ends[1] + "</span></div>" : "");
    var inp = $("input", el), out = $("output", el);
    function paint() { inp.style.setProperty("--fill", ((inp.value - o.min) / (o.max - o.min) * 100) + "%"); out.innerHTML = o.fmt(+inp.value); }
    function refresh() { inp.value = o.get(); paint(); }
    inp.addEventListener("input", function () { o.set(+inp.value); paint(); if (o.onChange) o.onChange(); });
    el.refresh = refresh; refresh();
    return el;
  }

  // ---------------- model ----------------
  function friction(b) {
    return clamp(lookup(COVERS, b.cover)[2] + lookup(GRITS, b.grit)[2] + (b.feel || 0) * 0.06, 0.05, 1.2);
  }
  function layoutFx(b) {
    var L = b.layout;
    if (!L) return { flare: 1, len: 0, ang: 0 };
    var aN = b.asy / 0.03, d = L.pinPap;
    var th = Math.min(d, 6.75) / 6.75 * Math.PI / 2;
    var flare = 0.55 + 0.6 * Math.sin(2 * th);
    var len = (d - 4) * 0.25, ang = (d - 4) * 0.12;
    if (L.fmt === "vls") {
      ang += (2.5 - L.buffer) * 0.15;
      if (aN > 0.15) ang += aN * (5 - L.mb) * 0.06;
    } else {
      len += (L.drill - 45) / 45 * 0.8;
      ang += (L.drill - 45) / 45 * 0.4 + (45 - L.val) / 45 * 0.4;
    }
    return { flare: flare, len: clamp(len, -1.5, 1.5), ang: clamp(ang, -1, 1) };
  }
  function simulate(b, pr, useLayout) {
    var rgN = (b.rg - 2.43) / 0.37, dN = b.diff / 0.06, aN = b.asy / 0.03;
    var F = friction(b), mph = pr.speed / 1.609, rv = clamp((pr.rpm / mph - 14) / 10, -0.6, 1);
    var fx = useLayout ? layoutFx(b) : { flare: 1, len: 0, ang: 0 };
    var tiltN = (pr.tilt - 12) / 12, rotN = (pr.rot - 45) / 30;
    var hMul = (1 - 0.12 * tiltN) * (1 + 0.08 * rotN) * (1 - Math.max(0, (pr.rot - 70) / 20) * 0.35);
    var S = 0.42 * F + 0.28 * dN * fx.flare + 0.18 * rv + 0.12 * (1 - rgN);
    var H = clamp((3 + 9 * S) * hMul, 3, 17);
    var bp = clamp(pr.oil - 5 * F - 3 * rv + 5 * rgN + 0.3 * (pr.speed - 26) + fx.len * 3 + tiltN * 2.5 + rotN * 2, 24, 50);
    var p = clamp(1.4 + aN + 0.8 * (0.9 - F) + fx.ang * 0.8 + rotN * 0.3, 1.1, 3.2);
    var L0 = pr.stand - 5, m = (pr.aim - L0) / 15, pts = [];
    for (var f = 0; f <= 60.0001; f += 0.5) {
      var bd;
      if (f <= bp) bd = L0 + m * f;
      else { var t = (f - bp) / (60 - bp); bd = L0 + m * bp + m * (f - bp) * (1 - t) + H * Math.pow(t, p); }
      pts.push([f, bd]);
    }
    var mi = 0;
    pts.forEach(function (q, i) { if (q[1] < pts[mi][1]) mi = i; });
    if (pts[mi][0] < 6) { mi = Math.round(bp / 0.5); }

    var L = b.layout, pr = st.profile;
    $("#dr-lstr").innerHTML = lstr(L) + "<small>" + (L.fmt === "vls" ? "핀-PAP × 핀 버퍼 × MB-PAP" : "드릴 각 × 핀-PAP × VAL 각") + "</small>";
    var s0 = simulate(b, pr, false), s1 = simulate(b, pr, true);
    function sharp(p) { return clamp((p - 1.1) / 2.1 * 100, 0, 100); }
    var rows = [
      { t: "길이 (브레이크포인트)", a: s0.bpFt, z: s1.bpFt, lo: 24, hi: 50, fmt: function (v) { return v.toFixed(0) + "ft"; }, ends: ["일찍", "길게"] },
      { t: "훅 폭", a: s0.H, z: s1.H, lo: 3, hi: 17, fmt: function (v) { return v.toFixed(1) + "보드"; }, ends: ["작게", "크게"] },
      { t: "후반 날카로움", a: sharp(s0.p), z: sharp(s1.p), lo: 0, hi: 100, fmt: function (v) { return v.toFixed(0); }, ends: ["부드럽게", "날카롭게"] }
    ];
    $("#dr-cmp").innerHTML = rows.map(function (r) {
      function pc(v) { return clamp((v - r.lo) / (r.hi - r.lo) * 100, 0, 100); }
      var a = pc(r.a), z = pc(r.z), l = Math.min(a, z), w = Math.abs(z - a);
      return '<div class="cmp"><div class="cmp-h"><b>' + r.t + "</b><span>" + r.fmt(r.a) + " → <strong>" + r.fmt(r.z) + "</strong></span></div>" +
        '<div class="db"><span class="tr"></span><span class="ln" style="left:' + l + "%;width:" + w + '%"></span><span class="d0" style="left:' + a + '%"></span><span class="d1" style="left:' + z + '%"></span></div>' +
        '<div class="db-l"><span>' + r.ends[0] + "</span><span>" + r.ends[1] + "</span></div></div>";
    }).join("") + '<div class="legend" style="justify-content:flex-start"><span><i style="background:var(--path0);height:10px;width:10px;border-radius:50%"></i>지공 전 (스펙만)</span><span><i style="background:var(--accent);height:10px;width:10px;border-radius:50%"></i>지공 후</span></div>';
    var why = [], d = L.pinPap;
    if (d < 3) why.push("<b>핀-PAP " + frac(d) + "</b> · 짧은 편이라 플레어가 작고, 일찍·부드럽게 구르는 쪽이에요.");
    else if (d <= 4) why.push("<b>핀-PAP " + frac(d) + "</b> · 플레어가 가장 크게 나오는 구간(약 3⅜″ 근처)이라 총 훅이 커지는 쪽이에요.");
    else if (d <= 5.5) why.push("<b>핀-PAP " + frac(d) + "</b> · 길이와 후반 반응이 균형 잡힌 쪽이에요.");
    else why.push("<b>핀-PAP " + frac(d) + "</b> · 긴 편이라 길게 가다 후반에 반응하고, 플레어는 조금 줄어드는 쪽이에요.");
    if (L.fmt === "vls") {
      why.push("<b>핀 버퍼 " + frac(L.buffer) + "</b> · " + (L.buffer < 2 ? "짧은 편이라 반응 전환이 빠르고 각진 쪽이에요." : L.buffer >= 3 ? "긴 편이라 전환이 부드러운 쪽이에요." : "보통 범위예요."));
      why.push("<b>MB-PAP " + frac(L.mb) + "</b> · " + (b.asy < 0.005 ? "이 볼은 대칭에 가까워서 MB 위치 영향이 작아요." : "비대칭 볼의 후반 반응 성격을 조절해요. 이 앱에서는 짧을수록 조금 더 날카롭게 계산해요."));
    } else {
      why.push("<b>드릴 각 " + L.drill + "°</b> · " + (L.drill < 40 ? "작은 편이라 일찍·부드럽게 반응하는 쪽이에요." : L.drill > 60 ? "큰 편이라 길게 가다 날카롭게 반응하는 쪽이에요." : "중간 범위예요."));
      why.push("<b>VAL 각 " + L.val + "°</b> · " + (L.val < 40 ? "작은 편이라 반응 전환이 빠른 쪽이에요." : L.val > 60 ? "큰 편이라 전환이 부드러운 쪽이에요." : "중간 범위예요."));
    }
    $("#dr-why").innerHTML = why.map(function (t) { return "<li>" + t + "</li>"; }).join("");
    var fx = s1.fx, eff = { rg: clamp(b.rg + fx.len * 0.03, 2.43, 2.8), diff: clamp(b.diff * fx.flare, 0, 0.06) };
    $("#dr-map").innerHTML = mapSVG([{ rg: b.rg, diff: b.diff, kind: "ring" }, { rg: eff.rg, diff: eff.diff, sel: true, num: idx(b), label: "지공 후 (추정)" }],
      [{ from: { rg: b.rg, diff: b.diff }, to: eff }]);
    save();
  };

  // ---------------- page: scores calendar ----------------
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  var Cal = { built: false };
  Cal.build = function () {
    var p = $("#p-scores");
    p.innerHTML =
      '<div class="ph"><div><div class="sec">Score log</div><h2>볼링 기록</h2></div><div class="count" id="sc-total"></div></div>' +
      '<div class="calgrid">' +
      '<div class="card"><div class="calnav y"><button type="button" id="cy-prev" aria-label="이전 해">‹</button><b id="cy"></b><button type="button" id="cy-next" aria-label="다음 해">›</button></div>' +
      '<div class="calnav"><button type="button" id="cm-prev" aria-label="이전 달">‹</button><b id="cm"></b><button type="button" id="cm-next" aria-label="다음 달">›</button></div>' +
      '<div class="dow">' + DOW.map(function (d) { return "<span>" + d + "</span>"; }).join("") + '</div><div class="days" id="cal-days"></div>' +
      '<button type="button" class="lnk todaybtn" id="cal-today">오늘로</button></div>' +
      '<div class="card avgc"><div class="sec">Average</div><div id="avg-mode"></div><div class="avgnum" id="avg-num"></div><div class="avgsub" id="avg-sub"></div></div>' +
      "</div>" +
      '<div class="card"><div class="card-h"><h3 id="g-title"></h3><span class="gsum" id="g-sum"></span></div>' +
      '<ul class="glist" id="g-list"></ul>' +
      '<div class="gadd"><div class="field"><label for="g-score">점수</label><input class="txt gscore" id="g-score" inputmode="numeric" autocomplete="off" placeholder="0~300"></div>' +
      '<div class="field"><label for="g-ball">사용한 볼</label><select id="g-ball"></select></div>' +
      '<button type="button" class="btn pri" id="g-add">게임 추가</button></div><p class="fn" id="g-msg" role="status"></p></div>' +
      '<div class="card brag"><div class="card-h"><h3>자랑하기</h3><span class="sec">Share</span></div>' +
      '<div id="br-mode"></div><p class="fn" id="br-hint"></p>' +
      '<textarea class="txt brtxt" id="br-text" readonly rows="6" aria-label="자랑 문구"></textarea>' +
      '<div class="acts" style="margin-top:10px"><button type="button" class="btn brand" id="br-copy">복사하기</button><button type="button" class="btn ghost" id="br-clear">고른 날짜 지우기</button></div>' +
      '<p class="fn" id="br-msg" role="status"></p></div>' +
      '<p class="fn" style="margin:0">기록은 이 폰 브라우저에만 저장돼요. 다른 사람은 볼 수 없어요.</p>';
    var c = st.cal;
    $("#cy-prev").onclick = function () { c.y--; Cal.update(); };
    $("#cy-next").onclick = function () { c.y++; Cal.update(); };
    $("#cm-prev").onclick = function () { c.m--; if (c.m < 0) { c.m = 11; c.y--; } Cal.update(); };
    $("#cm-next").onclick = function () { c.m++; if (c.m > 11) { c.m = 0; c.y++; } Cal.update(); };
    $("#cal-today").onclick = function () { var t = new Date(); c.y = t.getFullYear(); c.m = t.getMonth(); c.sel = ymd(t); Cal.update(); };
    Cal.mode = segmented([["day", "일"], ["week", "주"], ["month", "월"], ["year", "년"]], function () { return c.mode; }, function (v) { c.mode = v; Cal.update(); }, "평균 기간");
    Cal.mode.classList.add("sm");
    $("#avg-mode").appendChild(Cal.mode);
    $("#g-ball").addEventListener("change", function (e) { c.lastBall = +e.target.value; save(); });
    function add() {
      var t = $("#g-score").value.trim(), v = Number(t), msg = $("#g-msg");
      if (t === "" || !/^\d+$/.test(t) || v > 300) { msg.textContent = "점수는 0~300 사이 숫자로 넣어주세요."; msg.style.color = "var(--bad)"; $("#g-score").focus(); return; }
      st.games.push({ id: Date.now(), date: c.sel, score: v, ballId: +$("#g-ball").value || 0 });
      msg.style.color = ""; msg.textContent = v + "점 기록했어요.";
      $("#g-score").value = ""; $("#g-score").focus();
      Cal.update();
    }
    $("#g-add").addEventListener("click", add);
    $("#g-score").addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });
    if (!c.brag) c.brag = "period";
    if (!Array.isArray(c.pick)) c.pick = [];
    Cal.bmode = segmented([["period", "에버리지 기간 그대로"], ["pick", "날짜 직접 고르기"]], function () { return c.brag; }, function (v) { c.brag = v; Cal.update(); }, "자랑할 기록 고르기");
    $("#br-mode").appendChild(Cal.bmode);
    $("#br-clear").onclick = function () { c.pick = []; Cal.update(); };
    $("#br-copy").onclick = function () {
      var ta = $("#br-text"), t = ta.value, msg = $("#br-msg");
      function done() { msg.style.color = "var(--good)"; msg.textContent = "복사했어요. 카톡 대화창에 붙여넣기 하세요."; }
      function fail() { ta.focus(); ta.select(); msg.style.color = "var(--warn)"; msg.textContent = "자동 복사가 막혀 있어요. 선택된 글을 길게 눌러 복사해주세요."; }
      try { navigator.clipboard.writeText(t).then(done, fail); } catch (e) { fail(); }
    };
  };
  function gamesIn(a, b) { return st.games.filter(function (g) { return g.date >= a && g.date <= b; }); }
  function ballName(id) { var b = st.balls.filter(function (x) { return x.id === id; })[0]; return b ? b.name : ""; }
  Cal.update = function () {
    var c = st.cal, y = c.y, m = c.m;
    $("#cy").textContent = y + "년";
    $("#cm").textContent = (m + 1) + "월";
    $("#sc-total").innerHTML = "<b>" + st.games.length + "</b>게임";
    Cal.mode.refresh();
    var first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), lead = first.getDay(), today = ymd(new Date());
    var counts = {};
    st.games.forEach(function (g) { counts[g.date] = (counts[g.date] || 0) + 1; });
    var box = $("#cal-days");
    box.innerHTML = "";
    for (var i = 0; i < lead; i++) { var e = document.createElement("span"); e.className = "day out"; box.appendChild(e); }
    for (var d = 1; d <= days; d++) {
      var key = y + "-" + pad2(m + 1) + "-" + pad2(d), bt = document.createElement("button");
      bt.type = "button"; bt.textContent = d;
      bt.className = "day" + (counts[key] ? " has" : "") + (key === today ? " today" : "") + (key === c.sel ? " sel" : "");
      bt.setAttribute("aria-label", (m + 1) + "월 " + d + "일" + (counts[key] ? ", " + counts[key] + "게임" : ""));
      bt.setAttribute("aria-pressed", String(key === c.sel));
      if (c.brag === "pick" && c.pick.indexOf(key) >= 0) bt.className += " pick";
      (function (k) { bt.onclick = function () {
        if (c.brag === "pick") { var i = c.pick.indexOf(k); if (i >= 0) c.pick.splice(i, 1); else c.pick.push(k); }
        else c.sel = k;
        Cal.update();
      }; })(key);
      box.appendChild(bt);
    }
    // average
    var sd = parseYmd(c.sel), a, b, label;
    if (c.mode === "day") { a = b = c.sel; label = (sd.getMonth() + 1) + "월 " + sd.getDate() + "일"; }
    else if (c.mode === "week") {
      var s0 = new Date(sd.getFullYear(), sd.getMonth(), sd.getDate() - sd.getDay()), s6 = new Date(s0.getFullYear(), s0.getMonth(), s0.getDate() + 6);
      a = ymd(s0); b = ymd(s6); label = (s0.getMonth() + 1) + "/" + s0.getDate() + " ~ " + (s6.getMonth() + 1) + "/" + s6.getDate();
    } else if (c.mode === "month") { a = y + "-" + pad2(m + 1) + "-01"; b = y + "-" + pad2(m + 1) + "-31"; label = y + "년 " + (m + 1) + "월"; }
    else { a = y + "-01-01"; b = y + "-12-31"; label = y + "년"; }
    var gs = gamesIn(a, b), n = gs.length, sum = gs.reduce(function (t, g) { return t + g.score; }, 0);
    var hi = gs.reduce(function (t, g) { return Math.max(t, g.score); }, 0);
    $("#avg-num").innerHTML = n ? (sum / n).toFixed(1) : "—";
    $("#avg-sub").innerHTML = "<span>" + label + "</span>" + (n ? "<span><b>" + n + "</b> 게임 · 하이 <b>" + hi + "</b></span>" : "<span>기록 없음</span>");
    // selected day games
    var dayGames = st.games.filter(function (g) { return g.date === c.sel; });
    $("#g-title").textContent = (sd.getMonth() + 1) + "월 " + sd.getDate() + "일 (" + DOW[sd.getDay()] + ") 게임";
    var ds = dayGames.reduce(function (t, g) { return t + g.score; }, 0);
    $("#g-sum").innerHTML = dayGames.length ? "평균 <b>" + (ds / dayGames.length).toFixed(1) + "</b> · 합계 <b>" + ds + "</b>" : "";
    var ul = $("#g-list");
    ul.innerHTML = dayGames.length ? "" : '<li style="display:block"><p class="empty" style="padding:10px 0">이날 기록이 없어요. 아래에서 점수를 넣어보세요.</p></li>';
    dayGames.forEach(function (g, i) {
      var li = document.createElement("li");
      li.innerHTML = '<span class="gno">' + (i + 1) + 'G</span><span class="gsc">' + g.score + '</span><span class="gball">' + (g.ballId && ballName(g.ballId) ? esc(ballName(g.ballId)) : "볼 미선택") + '</span><button type="button" class="gdel">삭제</button>';
      var del = li.querySelector(".gdel");
      del.addEventListener("click", function () {
        if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "한 번 더"; return; }
        st.games = st.games.filter(function (x) { return x.id !== g.id; });
        Cal.update();
      });
      ul.appendChild(li);
    });
    var sel = $("#g-ball");
    sel.innerHTML = '<option value="0">볼 선택 안 함</option>' + st.balls.map(function (b2, i) { return '<option value="' + b2.id + '">' + (i + 1) + ". " + esc(b2.name) + "</option>"; }).join("");
    sel.value = st.balls.some(function (b2) { return b2.id === c.lastBall; }) ? String(c.lastBall) : "0";
    // brag text
    Cal.bmode.refresh();
    var bg, blabel;
    if (c.brag === "pick") {
      var pk = c.pick.slice().sort();
      bg = st.games.filter(function (g) { return pk.indexOf(g.date) >= 0; });
      blabel = pk.length ? pk.map(function (k) { var d = parseYmd(k); return (d.getMonth() + 1) + "/" + d.getDate(); }) : [];
      blabel = blabel.length > 4 ? blabel.slice(0, 3).join(", ") + " 외 " + (blabel.length - 3) + "일" : blabel.join(", ");
      $("#br-hint").textContent = "달력에서 자랑할 날짜를 눌러서 골라요 · " + pk.length + "일 선택됨 (주황 테두리)";
    } else {
      bg = gs; blabel = label;
      $("#br-hint").textContent = "오른쪽 위 에버리지에서 고른 기간(" + label + ") 기록으로 만들어요.";
    }
    $("#br-clear").hidden = c.brag !== "pick";
    bg = bg.slice().sort(function (x, y) { return x.date < y.date ? -1 : x.date > y.date ? 1 : x.id - y.id; });
    var bn = bg.length, bs = bg.reduce(function (t, g) { return t + g.score; }, 0), bh = bg.reduce(function (t, g) { return Math.max(t, g.score); }, 0);
    var names = []; bg.forEach(function (g) { var nm2 = g.ballId && ballName(g.ballId); if (nm2 && names.indexOf(nm2) < 0) names.push(nm2); });
    var txt = bn ? ["🎳 Crazy Bowl-in 기록", blabel + " · " + bn + "게임"]
      .concat(bn <= 12 ? [bg.map(function (g) { return g.score; }).join(" / ")] : [])
      .concat(["에버 " + (bs / bn).toFixed(1) + " · 하이 " + bh + (bn > 1 ? " · 합계 " + bs : "")])
      .concat(names.length ? ["볼: " + (names.length > 2 ? names.slice(0, 2).join(", ") + " 외 " + (names.length - 2) + "개" : names.join(", "))] : [])
      .join("\n") : "";
    $("#br-text").value = bn ? txt : (c.brag === "pick" ? "달력에서 기록이 있는 날짜를 골라주세요." : "이 기간에는 아직 기록이 없어요.");
    $("#br-copy").disabled = !bn;
    save();
  };

  // ---------------- routing ----------------
  var PAGES = { myball: My, motion: Mo, drill: Dr, scores: Cal };
  function show(scroll) {
    var h = location.hash.replace("#", "");
    if (!PAGES[h]) h = "myball";
    Object.keys(PAGES).forEach(function (k) {
      $("#p-" + k).hidden = k !== h;
      $("#t-" + k).setAttribute("aria-current", k === h ? "page" : "false");
    });
    var pg = PAGES[h];
    if (!pg.built) { pg.build(); pg.built = true; }
    if (h === "drill") Dr.render(); else pg.update();
    if (scroll) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function () { show(true); });
  show(false);

  // ---------------- splash ----------------
  var sp = document.getElementById("splash");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function closeSplash() { if (sp.hidden) return; sp.classList.add("out"); setTimeout(function () { sp.hidden = true; }, 380); }
  if (reduce) sp.hidden = true; else { setTimeout(closeSplash, 1700); sp.addEventListener("click", closeSplash); }
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); });
}
</script>
</body>
