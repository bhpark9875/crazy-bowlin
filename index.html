<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crazy Bowl-in</title>
<meta name="theme-color" content="#eaf5fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1624" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bowl-in">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<style>
/* Layout: one-screen phone app. App bar, a page that fills the remaining height (no page scroll), bottom tab bar.
   My balls: map <-> list swipe. Motion: lane left + controls right, tabbed notes below. Scores: calendar + average, day games. */
:root {
  --bg: #eaf5fc; --surface: #ffffff; --surface2: #f3f9fd;
  --ink: #13294a; --ink2: #44597a; --muted: #687b95; --line: #d5e5f1; --grid: #e4eef6;
  --accent: #2f6fbe; --on-accent: #ffffff; --wash: rgba(47, 111, 190, 0.09);
  --brand: #e48a2a; --on-brand: #ffffff; --brand-wash: rgba(228, 138, 42, 0.12);
  --good: #14804a; --warn: #a15c00; --bad: #c8202f;
  --z1: #cddeeb;
  --lane: #efdcb9; --laneLine: #a77d48; --gutter: #cfdbe6; --oil: rgba(70, 130, 215, 0.20);
  --pin: #ffffff; --pinEdge: #8a9cb2; --path0: #8ea2ba; --shade: rgba(19, 41, 74, 0.35);
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1624; --surface: #132137; --surface2: #18283f;
    --ink: #eaf2fb; --ink2: #b3c4da; --muted: #8799b1; --line: #24364f; --grid: #1c2c42;
    --accent: #6aa5f0; --on-accent: #0c1624; --wash: rgba(106, 165, 240, 0.14);
    --brand: #f2a85a; --on-brand: #1a1206; --brand-wash: rgba(242, 168, 90, 0.14);
    --good: #3fbf7f; --warn: #e0a040; --bad: #ef6b63;
    --z1: #27394f;
    --lane: #4a3926; --laneLine: #1f170d; --gutter: #22324a; --oil: rgba(90, 150, 230, 0.20);
    --pin: #e9eef3; --pinEdge: #6b7c93; --path0: #7d90a8; --shade: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1624; --surface: #132137; --surface2: #18283f;
  --ink: #eaf2fb; --ink2: #b3c4da; --muted: #8799b1; --line: #24364f; --grid: #1c2c42;
  --accent: #6aa5f0; --on-accent: #0c1624; --wash: rgba(106, 165, 240, 0.14);
  --brand: #f2a85a; --on-brand: #1a1206; --brand-wash: rgba(242, 168, 90, 0.14);
  --good: #3fbf7f; --warn: #e0a040; --bad: #ef6b63;
  --z1: #27394f;
  --lane: #4a3926; --laneLine: #1f170d; --gutter: #22324a; --oil: rgba(90, 150, 230, 0.20);
  --pin: #e9eef3; --pinEdge: #6b7c93; --path0: #7d90a8; --shade: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 14px; line-height: 1.5; word-break: keep-all; overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
.app { height: 100%; max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; }
.appbar { flex: none; display: flex; align-items: center; gap: 9px; padding-block: 8px 6px; }
.logo { width: 30px; height: 30px; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px var(--brand); object-fit: cover; }
.appbar h1 { margin: 0; font-family: var(--font-num); font-size: 21px; font-weight: 700; letter-spacing: 0.02em; }
.tg-s { display: none; }
.appbar .tag { white-space: nowrap; margin-left: auto; font-family: var(--font-num); font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
main { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.page { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; padding-bottom: 8px; }
.page > * { min-width: 0; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; border-top: 1px solid var(--line); padding-block: 4px calc(4px + env(safe-area-inset-bottom, 0px)); }
.tabbar a { position: relative; display: grid; justify-items: center; align-content: center; min-height: 50px; border-radius: 10px; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 500; line-height: 1.2; }
.tabbar a b { font-family: var(--font-num); font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; }
.tabbar a[aria-current="page"] { color: var(--accent); background: var(--wash); }
.tabbar a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* common */
.rowh { flex: none; display: flex; align-items: center; gap: 8px; }
.rowh h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; white-space: nowrap; }
.rowh h2 small { font-family: var(--font-num); font-size: 15px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.sp { flex: 1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.sec { font-family: var(--font-num); font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.fn { font-size: 11.5px; color: var(--muted); margin: 0; }
.btn { font: inherit; font-size: 13px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 7px 12px; min-height: 40px; cursor: pointer; white-space: nowrap; }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.brand { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 34px; padding: 4px 10px; font-size: 12.5px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: flex; gap: 4px; }
.seg button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink2); border-radius: 999px; padding: 4px 11px; min-height: 34px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg.wrap { flex-wrap: wrap; }
.seg.fill button { flex: 1; min-width: 0; padding-inline: 4px; }
.txt, select { font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; width: 100%; min-height: 40px; }
select.sm { font-size: 14px; min-height: 36px; padding: 4px 8px; }
.flabel { font-size: 12.5px; font-weight: 500; color: var(--ink2); }
.field { display: grid; gap: 4px; min-width: 0; }
.btn:focus-visible, .seg button:focus-visible, .txt:focus-visible, select:focus-visible, .sb:focus-visible, .sv:focus-visible, .lnk:focus-visible, .li-main:focus-visible, input[type="range"]:focus-visible, .x:focus-visible, .day:focus-visible, .calnav button:focus-visible, .gdel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.mut { color: var(--muted); }
.nb { display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--surface); font-family: var(--font-num); font-weight: 700; font-size: 14px; }
.nb.sel { background: var(--accent); color: var(--on-accent); }
.mono { font-family: var(--font-num); font-weight: 600; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 14px 8px; margin: 0; }
svg text { font-family: var(--font-body); }
svg .num { font-family: var(--font-num); font-weight: 600; }

/* stepper */
.stps { display: grid; gap: 10px; }
.stp { display: grid; gap: 4px; min-width: 0; }
.stp-top { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.stp-k { font-weight: 700; font-size: 13px; }
.stp-s { font-size: 11.5px; color: var(--muted); }
.stp-row { display: grid; grid-template-columns: 42px minmax(0, 1fr) 42px; gap: 6px; }
.sb { font: inherit; font-size: 20px; line-height: 1; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 10px; min-height: 42px; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.sb:active { background: var(--wash); }
.sv { font-family: var(--font-num); font-weight: 600; font-size: 22px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; width: 100%; padding: 2px; }
.stp-meta { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 11.5px; color: var(--muted); align-items: center; }
.dl.warn { color: var(--bad); }
.lnk { font: inherit; font-size: 11.5px; background: none; border: 0; color: var(--accent); padding: 2px 0; cursor: pointer; margin-left: auto; min-height: 26px; }

/* range with board ticks */
.rgrid { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; column-gap: 4px; align-items: center; }
.rgrid .ticks { grid-column: 2; }
.nb { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--surface2); color: var(--ink); font-family: var(--font-num); font-size: 18px; font-weight: 700; line-height: 1; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.nb:active { background: var(--wash); border-color: var(--accent); color: var(--accent); }
.nb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rng { display: grid; gap: 0; min-width: 0; }
.rng-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.rng-top span { font-size: 12px; font-weight: 500; color: var(--ink2); white-space: nowrap; }
.rng-top output { font-family: var(--font-num); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rng-top output small { font-size: 11.5px; font-weight: 600; color: var(--muted); margin-left: 1px; }
.rtrack { position: relative; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; margin: 0; background: transparent; cursor: pointer; position: relative; z-index: 1; display: block; }
input[type="range"]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--z1); }
input[type="range"]::-moz-range-track { height: 5px; border-radius: 3px; background: var(--z1); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); margin-top: -8.5px; }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
.ticks { position: relative; height: 13px; }
.ticks i { position: absolute; top: 0; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--ink2); opacity: 0.7; }
.ticks span { position: absolute; top: 3px; transform: translateX(-50%); font-family: var(--font-num); font-size: 9.5px; color: var(--muted); line-height: 1; padding-top: 4px; }

/* my balls */
.swipe { flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
.track { display: flex; width: 200%; height: 100%; transition: transform 0.28s ease; }
.pane { width: 50%; height: 100%; display: flex; flex-direction: column; gap: 8px; min-width: 0; padding-right: 1px; }
.pane + .pane { padding-left: 1px; }
.mapcard { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 8px 6px; }
.mapbox { flex: 1; min-height: 0; }
.mapbox svg { display: block; width: 100%; height: 100%; }
.quads { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 4px; }
.qd { border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px; text-align: center; font-size: 10.5px; color: var(--ink2); line-height: 1.25; }
.qd b { display: block; font-family: var(--font-num); font-size: 17px; color: var(--ink); }
.qd.top { border-color: var(--accent); background: var(--wash); }
.detail { flex: none; display: grid; gap: 6px; }
.dt-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dt-h b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dt-h .pill { margin-left: auto; }
.dt-v { font-size: 12px; color: var(--ink2); }
.dt-v .mono { font-size: 14px; color: var(--ink); }
.dt-acts { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 6px; }
.dots { flex: none; display: flex; justify-content: center; gap: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--z1); }
.dots i.on { background: var(--accent); width: 16px; border-radius: 3px; }
.listcard { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 10px; overscroll-behavior: contain; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.li-main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 9px 2px; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; cursor: pointer; border-radius: 8px; }
.li-main .n { font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-main .s { display: block; font-size: 11.5px; color: var(--muted); }
.li-main .t { font-size: 11.5px; color: var(--ink2); text-align: right; }

/* motion */
.mo-top { flex: none; display: flex; gap: 6px; align-items: center; }
.mo-top select { flex: 1; min-width: 0; }
.stats4 { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.st4 { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px; display: grid; gap: 0; min-width: 0; }
.st4 > span { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.st4 > b { font-family: var(--font-num); font-size: 20px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.st4 > b small { font-size: 11px; color: var(--muted); font-weight: 600; }
.mo-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr); gap: 8px; }
.lanecol { min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.lanebox { flex: 1; min-height: 0; }
.lanebox svg { display: block; width: 100%; height: 100%; }
.leg { flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 8px; font-size: 10px; color: var(--ink2); padding-top: 2px; }
.leg span { display: inline-flex; align-items: center; gap: 4px; }
.leg i { width: 12px; height: 3px; border-radius: 2px; }
.ctrlcol { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 9px; overscroll-behavior: contain; }
.ctrl2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.ctrl2 select { padding: 4px 2px 4px 6px; font-size: 13.5px; }
.ctrl2 .seg { gap: 2px; }
.ctrl2 .seg button { padding: 4px 7px; font-size: 12px; }
.whybox { flex: 1; min-height: 72px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; overscroll-behavior: contain; }
.whybox .sec { margin-bottom: 3px; }
.mo-bottom { flex: none; height: 118px; display: flex; flex-direction: column; gap: 5px; padding: 8px 10px; }
.mo-tabrow { flex: none; display: flex; gap: 6px; align-items: center; }
.mo-tabrow #mo-tabs { flex: 1; min-width: 0; }
.nb.fold { display: none; width: 30px; height: 30px; font-size: 13px; flex: none; }
.mo-bottom.folded { height: auto; }
.mo-bottom.folded .panel { display: none; }
.mo-bottom .panel { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.adv { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--ink2); line-height: 1.45; }
.adv li { padding-left: 11px; position: relative; }
.adv li::before { content: ""; position: absolute; left: 0; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.adv b { color: var(--ink); font-weight: 500; }
.cmp { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; padding-block: 2px; }
.cmp .bar { position: relative; height: 14px; }
.cmp .bar .tr { position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--z1); }
.cmp .bar .d0, .cmp .bar .d1 { position: absolute; top: 1px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-50%); box-shadow: 0 0 0 2px var(--surface); }
.cmp .bar .d0 { background: var(--path0); } .cmp .bar .d1 { background: var(--accent); }
.cmp .v { font-family: var(--font-num); font-weight: 600; font-size: 13px; white-space: nowrap; }

/* scores */
.calgrid { flex: none; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 8px; }
.calgrid .card { padding: 8px; }
.calnav { display: flex; align-items: center; justify-content: space-between; gap: 2px; }
.calnav button { width: 30px; height: 30px; border: 0; background: var(--surface2); border-radius: 8px; font-size: 16px; line-height: 1; color: var(--ink); cursor: pointer; }
.calnav b { font-family: var(--font-num); font-size: 17px; font-weight: 700; }
.calnav.y b { font-size: 13.5px; color: var(--ink2); }
.calnav.y button { width: 26px; height: 24px; font-size: 13px; }
.dow, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
.dow span { font-size: 10px; color: var(--muted); }
.dow span:first-child { color: var(--bad); } .dow span:last-child { color: var(--accent); }
.day { position: relative; height: 26px; border: 0; background: none; border-radius: 50%; font-family: var(--font-num); font-weight: 600; font-size: 13px; color: var(--ink); cursor: pointer; padding: 0; }
.day.out { visibility: hidden; }
.day.has::after { content: ""; position: absolute; bottom: 1px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.day.today { box-shadow: inset 0 0 0 1.5px var(--ink2); }
.day.sel { background: var(--accent); color: var(--on-accent); }
.day.sel.has::after { background: var(--on-accent); }
.day.pick { box-shadow: inset 0 0 0 2.5px var(--brand); }
.avgc { display: flex; flex-direction: column; gap: 6px; }
.avgnum { font-family: var(--font-num); font-size: clamp(28px, 9vw, 40px); font-weight: 700; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.avgsub { display: grid; gap: 2px; font-size: 11.5px; color: var(--muted); }
.avgsub b { font-family: var(--font-num); font-size: 15px; color: var(--ink); }
.pickbar { flex: none; display: flex; align-items: center; gap: 8px; background: var(--brand-wash); border: 1px solid var(--brand); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; }
.games { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
.g-h { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.g-h b { font-size: 14px; }
.g-h span { font-family: var(--font-num); font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.g-h span b { color: var(--ink); font-size: 15px; }
.glist { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 0; overscroll-behavior: contain; }
.glist li { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
.glist li:first-child { border-top: 0; }
.gno { font-family: var(--font-num); font-weight: 600; font-size: 13px; color: var(--muted); width: 24px; }
.gsc { font-family: var(--font-num); font-weight: 700; font-size: 24px; line-height: 1; min-width: 46px; white-space: nowrap; }
.gball { flex: 1; min-width: 0; font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gdel { font: inherit; font-size: 11.5px; color: var(--ink2); background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; min-height: 32px; cursor: pointer; }
.gdel.armed { color: var(--bad); border-color: var(--bad); }
.gadd { flex: none; display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; gap: 6px; }
.gscore { font-family: var(--font-num) !important; font-weight: 700; font-size: 20px !important; text-align: center; }
.gmsg { flex: none; min-height: 16px; }

/* bottom sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; }
.sheet-wrap .shade { position: absolute; inset: 0; background: var(--shade); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 720px; margin-inline: auto; max-height: 90%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; display: grid; gap: 12px; align-content: start;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overscroll-behavior: contain; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--z1); margin: 0 auto; }
.sh-h { display: flex; align-items: center; gap: 8px; }
.sh-h h3 { margin: 0; font-size: 17px; }
.x { margin-left: auto; font: inherit; font-size: 20px; line-height: 1; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); cursor: pointer; }
.lstr { font-family: var(--font-num); font-weight: 700; font-size: 26px; letter-spacing: 0.02em; line-height: 1.1; margin: 0; }
.lstr small { display: block; font-family: var(--font-body); font-size: 11.5px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.brtxt { font-family: var(--font-body); font-size: 14px; line-height: 1.6; resize: none; min-height: 130px; background: var(--brand-wash); border-color: transparent; }

/* motion between screens */
@keyframes inR { from { transform: translateX(26%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes inL { from { transform: translateX(-26%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes outL { to { transform: translateX(-26%); opacity: 0; } }
@keyframes outR { to { transform: translateX(26%); opacity: 0; } }
.page.in-r { animation: inR 0.3s cubic-bezier(.2, .8, .2, 1) both; }
.page.in-l { animation: inL 0.3s cubic-bezier(.2, .8, .2, 1) both; }
.page.out-l { animation: outL 0.22s ease-in both; pointer-events: none; }
.page.out-r { animation: outR 0.22s ease-in both; pointer-events: none; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet { animation: up 0.28s cubic-bezier(.2, .8, .2, 1); }
.sheet-wrap .shade { animation: fade 0.2s ease; }
.sheet-wrap.closing .sheet { animation: up 0.2s ease-in reverse both; }
.sheet-wrap.closing .shade { animation: fade 0.2s ease reverse both; }
@keyframes tap { 50% { transform: scale(1.4); } }
.mdot.tap circle:nth-of-type(2) { transform-box: fill-box; transform-origin: center; animation: tap 0.2s ease; }
/* ---- small phones ---- */
@media (max-height: 720px) {
  .appbar { padding-block: 5px 4px; } .logo { width: 26px; height: 26px; } .appbar h1 { font-size: 19px; }
  .tabbar a { min-height: 44px; }
  .page { gap: 6px; padding-bottom: 6px; }
  .st4 { padding: 2px 6px; } .st4 > b { font-size: 17px; } .st4 > span { font-size: 10px; }
  .mo-bottom { height: 92px; padding: 6px 8px; }
  .ctrlcol { gap: 3px; padding: 6px 7px; }
  .rng-top output { font-size: 16px; }
  input[type="range"] { height: 24px; }
  .day { height: 23px; font-size: 12px; }
}
@media (max-height: 620px) {
  .nb.fold { display: block; }
  .mo-bottom { height: 84px; }
  .tabbar a { min-height: 40px; font-size: 12px; }
  .stats4 .pill { display: none; }
  .day { height: 21px; }
}
@media (max-width: 359px) {
  .appbar h1 { font-size: 17px; } .appbar { gap: 7px; }
  .tg-l { display: none; } .tg-s { display: inline; }
  .nb { width: 26px; height: 26px; font-size: 16px; } .rgrid { grid-template-columns: 26px minmax(0, 1fr) 26px; column-gap: 2px; }
  .st4 > b { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { .page.in-r, .page.in-l, .page.out-l, .page.out-r, .sheet, .sheet-wrap .shade, .sheet-wrap.closing .sheet, .sheet-wrap.closing .shade, .mdot.tap circle { animation: none; } }

/* splash */
#splash { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: grid; place-items: center; transition: opacity 0.35s ease; }
#splash.out { opacity: 0; pointer-events: none; }
.spl { display: grid; justify-items: center; gap: 14px; }
.sp-icon { width: 168px; height: 168px; border-radius: 26%; box-shadow: 0 12px 30px rgba(19, 41, 74, 0.18); animation: pop 0.9s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes pop { 0% { transform: scale(0.4) rotate(-10deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
.sp-ball { width: 22px; height: 22px; border-radius: 50%; background: var(--bad); animation: rollin 0.8s 0.5s ease-out both; }
@keyframes rollin { from { transform: translateX(-120px) rotate(-360deg); opacity: 0; } to { transform: none; opacity: 1; } }
.sp-title { font-family: var(--font-num); font-size: 30px; font-weight: 700; letter-spacing: 0.04em; opacity: 0; animation: fadeup 0.45s 0.75s ease both; }
@keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .sp-icon, .sp-ball, .sp-title { animation: none; opacity: 1; } .track { transition: none; } }
</style>

        function ok() { msg.style.color = "var(--good)"; msg.textContent = "복사했어요. 카톡 대화창에 붙여넣기 하세요."; }
        function no() { ta.focus(); ta.select(); msg.style.color = "var(--warn)"; msg.textContent = "자동 복사가 막혀 있어요. 선택된 글을 길게 눌러 복사해주세요."; }
        try { navigator.clipboard.writeText(ta.value).then(ok, no); } catch (e) { no(); }
      };
      fill();
    });
  }

  // ================= routing =================
  var PAGES = { my: My, motion: Mo, scores: Cal };
  function current() { var h = location.hash.replace("#", ""); if (h === "myball" || h === "drill") h = "my"; return PAGES[h] ? h : "my"; }
  var ORDER = ["my", "motion", "scores"], curPage = null, pageTimer = null;
  function render() {
    var h = current(), prev = curPage;
    Object.keys(PAGES).forEach(function (k) { $("#t-" + k).setAttribute("aria-current", k === h ? "page" : "false"); });
    var pg = PAGES[h]; if (!pg.built) { pg.build(); pg.built = true; }
    setTag(); pg.update();
    clearTimeout(pageTimer);
    Object.keys(PAGES).forEach(function (k) { $("#p-" + k).classList.remove("in-r", "in-l", "out-l", "out-r"); });
    curPage = h;
    if (!prev || prev === h || REDUCE) { Object.keys(PAGES).forEach(function (k) { $("#p-" + k).hidden = k !== h; }); return; }
    var fwd = ORDER.indexOf(h) > ORDER.indexOf(prev), el = $("#p-" + h), old = $("#p-" + prev);
    Object.keys(PAGES).forEach(function (k) { if (k !== h && k !== prev) $("#p-" + k).hidden = true; });
    el.hidden = false; old.hidden = false;
    el.classList.add(fwd ? "in-r" : "in-l"); old.classList.add(fwd ? "out-l" : "out-r");
    pageTimer = setTimeout(function () { old.hidden = true; old.classList.remove("out-l", "out-r"); el.classList.remove("in-r", "in-l"); }, 310);
  }
  window.addEventListener("hashchange", function () { if (!sheet.hidden) closeSheet(); render(); });
  render();

  // ================= splash =================
  var spl = $("#splash"), reduce = REDUCE;
  function closeSplash() { if (spl.hidden) return; spl.classList.add("out"); setTimeout(function () { spl.hidden = true; }, 380); }
  if (reduce) spl.hidden = true; else { setTimeout(closeSplash, 1600); spl.addEventListener("click", closeSplash); }
})();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function () {}); }); }
</script>
